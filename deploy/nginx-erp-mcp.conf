# ---------------------------------------------------------------------------
# PART 1: put these two lines in the `http { ... }` block (/etc/nginx/nginx.conf),
#         NOT inside a server block. They define per-IP rate limits.
# ---------------------------------------------------------------------------
# limit_req_zone $binary_remote_addr zone=erp_mcp_login:10m rate=10r/m;
# limit_req_zone $binary_remote_addr zone=erp_mcp_api:10m   rate=120r/m;
# limit_req_zone $binary_remote_addr zone=erp_data_api:10m  rate=120r/m;

# ---------------------------------------------------------------------------
# PART 2: inside the existing HTTPS `server { ... }` block for aiagent.zorder.in.
#         Serves both services: /erp-mcp/ (MCP connector) and /erp-api/ (Data API).
#         Does not touch the existing json-backend locations.
# ---------------------------------------------------------------------------

# The ERP header Instance_Id contains an underscore, which nginx drops by default.
underscores_in_headers on;

# Login page, client registration and token endpoint: strict per-IP limit
location ~ ^/erp-mcp/(login|register|token|authorize)(/.*)?$ {
    limit_req zone=erp_mcp_login burst=10 nodelay;
    limit_req_status 429;
    rewrite ^/erp-mcp/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8810;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

# MCP endpoint and everything else of the connector
location /erp-mcp/ {
    limit_req zone=erp_mcp_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8810/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# OAuth discovery documents live at the domain root (RFC 9728 / RFC 8414 path insertion)
location = /.well-known/oauth-protected-resource/erp-mcp/mcp {
    proxy_pass http://127.0.0.1:8810;
    proxy_set_header Host $host;
}
location = /.well-known/oauth-authorization-server/erp-mcp {
    proxy_pass http://127.0.0.1:8810/.well-known/oauth-authorization-server;
    proxy_set_header Host $host;
}

# ERP Data API (REST for UniReport and other apps). The MCP connector does NOT use this public
# path; it calls the Data API directly on 127.0.0.1:8820.
location /erp-api/ {
    limit_req zone=erp_data_api burst=60 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8820/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
}
